[multiplex]
id = 0xF001 # Ensemble ID
ecc = 0xE0  # Country code
name = "TestMUX"
shortname = "T-MUX"
channel = 12C

[services]
[[service]]
label = "Vintage Radio"
shortlabel = "Vintage"
id = 0x1001
language = eng
component_type = audio
subchannel_id = 1
subchannel_bitrate = 64

[subchannels]
[[subchannel]]
id = 1
bitrate = 128
protection = EEP-3A
input = fifo://audio.fifo

